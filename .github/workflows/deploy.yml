name: 部署

# 竞迹生产发布：复用 scripts/release.sh，保证与 Mac 本地手动发布完全同一条链路
# （构建 linux/amd64 镜像 → 推送阿里云 ACR → SSH 到 ECS 切换镜像标签 → 健康检查）。
#
# 触发方式：
#   1. main 分支的 CI 通过后自动发布（workflow_run）；
#   2. 手动运行本工作流：可只构建推送、预演，或填 tag 回滚到已推送的旧版本。
#
# 前置配置（Settings → Secrets and variables → Actions）：
#   Secrets：ACR_USERNAME、ACR_PASSWORD、DEPLOY_SSH_KEY（deploy 账户的 ed25519 私钥全文）
#   Variables（可省略，使用下方默认值）：ACR_IMAGE、DEPLOY_HOST、DEPLOY_USER、REMOTE_DIR
#
# 注意：GitHub Actions 的出口 IP 不固定，ECS 安全组需放行其 TCP 22，
# 否则请改用 workflow_dispatch 手动触发，或继续在 Mac 上执行 scripts/release.sh。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: '已推送到 ACR 的镜像标签（Git 短 SHA）。填写后跳过构建，直接部署/回滚到该版本'
        required: false
        type: string
      build_only:
        description: '只构建并推送镜像，不部署'
        required: false
        default: false
        type: boolean
      dry_run:
        description: '预演：只打印将执行的命令，不做任何改动'
        required: false
        default: false
        type: boolean
  workflow_run:
    workflows: ['CI']
    types: [completed]

# 生产发布必须串行，且不取消进行中的部署。
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: 构建镜像并发布到 ECS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    env:
      IMAGE: ${{ vars.ACR_IMAGE || 'crpi-0mzy172e4og0xh7s.cn-hangzhou.personal.cr.aliyuncs.com/docker_soren/jingji' }}
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST || '182.92.6.195' }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER || 'deploy' }}
      REMOTE_DIR: ${{ vars.REMOTE_DIR || '/srv/jingji' }}
    steps:
      - name: 检出待发布提交
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: 校验部署凭据是否齐全
        id: creds
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "${ACR_USERNAME:-}" ] || missing+=(ACR_USERNAME)
          [ -n "${ACR_PASSWORD:-}" ] || missing+=(ACR_PASSWORD)
          [ -n "${DEPLOY_SSH_KEY:-}" ] || missing+=(DEPLOY_SSH_KEY)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::未配置仓库密钥 ${missing[*]}，跳过发布。请在 Settings → Secrets and variables → Actions 中配置后重跑。"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 准备 Docker Buildx
        if: steps.creds.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - name: 解析镜像仓库地址
        if: steps.creds.outputs.skip != 'true'
        id: image
        run: echo "registry=${IMAGE%%/*}" >> "$GITHUB_OUTPUT"

      - name: 登录阿里云 ACR
        if: steps.creds.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.image.outputs.registry }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: 写入部署私钥与主机密钥
        if: steps.creds.outputs.skip != 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          key_file="$RUNNER_TEMP/jingji_deploy"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$key_file"
          chmod 600 "$key_file"
          # 首次连接登记主机公钥；如需严格校验，可预先把 known_hosts 内容存成仓库变量再写入。
          if ! ssh-keyscan -H "$DEPLOY_HOST" 2>/dev/null >> ~/.ssh/known_hosts; then
            echo "::error::无法获取 $DEPLOY_HOST 的 SSH 主机密钥，请确认 ECS 安全组放行 TCP 22。"
            exit 1
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: 构建推送并发布
        if: steps.creds.outputs.skip != 'true'
        env:
          DEPLOY_SSH_KEY: ${{ runner.temp }}/jingji_deploy
          INPUT_TAG: ${{ github.event.inputs.tag }}
          INPUT_BUILD_ONLY: ${{ github.event.inputs.build_only }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "${INPUT_TAG:-}" ]; then args+=(--tag "$INPUT_TAG"); fi
          if [ "${INPUT_BUILD_ONLY:-false}" = "true" ]; then args+=(--build-only); fi
          if [ "${INPUT_DRY_RUN:-false}" = "true" ]; then args+=(--dry-run); fi
          bash scripts/release.sh ${args[@]+"${args[@]}"}

      - name: 发布结果
        if: steps.creds.outputs.skip != 'true'
        run: |
          echo "镜像仓库：$IMAGE"
          echo "部署目标：$DEPLOY_USER@$DEPLOY_HOST:$REMOTE_DIR"
          echo "回滚命令：本工作流手动运行，tag 填入上一个已通过的 Git 短 SHA。"
