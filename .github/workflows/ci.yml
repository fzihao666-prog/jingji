name: CI

# 竞迹持续集成：类型检查、小程序契约、单元测试、接口冒烟与前端构建。
# 与部署解耦：部署由 deploy.yml 在本工作流成功后触发。
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

# 同一分支/PR 只保留最新一次运行，避免排队跑过时提交。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # 与 Dockerfile 的运行阶段保持一致（node:22.23.2-bookworm-slim）。
  # 测试用例使用 node:sqlite，需要 Node >= 22.5。
  NODE_VERSION: '22.23.2'

jobs:
  lint:
    name: 静态检查
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: ESLint
        run: npm run lint

      - name: 微信小程序类型检查
        run: npm run mini:typecheck

      - name: 微信小程序字典同步校验
        run: npm run mini:dictionary-check

  test:
    name: 单元测试
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: Vitest
        run: npm run test

      - name: 服务端接口冒烟（独立端口 8791 + 临时数据库，不触碰正式数据）
        run: npm run api-check

  build:
    name: 构建产物
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 全量类型检查
        run: npm run check

      - name: 构建前端与服务端
        run: npm run build

      - name: 上传 dist 产物
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 7

  style:
    # 仓库当前存在历史遗留的格式与 CSS 告警，先作为非阻断作业提供可见性，
    # 待清理完成后可移除 continue-on-error 让其参与门禁。
    name: 格式与样式（非阻断）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: Prettier
        run: npm run format:check

      - name: Stylelint
        run: npm run lint:styles
